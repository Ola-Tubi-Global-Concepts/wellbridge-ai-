name: WellBridge AI Build and Database Security Validation

on:
  push:
    branches:
      - feature/admin-verification-system
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wellbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellbridge_test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: TypeScript validation
        run: npm run typecheck

      - name: Lint validation
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create restricted test application role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE wellbridge_app NOLOGIN NOSUPERUSER NOBYPASSRLS;"

      - name: Apply pathway schema migrations to disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_healthcare_pathway_verification.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_contact_channels_and_area_authorities.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/003_admin_verification_security.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/004_admin_access_policies_and_role_governance.sql

      - name: Run administrator RLS and separation-of-duties regression tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/migration-004-security-tests.sql
