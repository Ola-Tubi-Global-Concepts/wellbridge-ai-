name: Build and deploy WellBridge AI to Azure App Service

# Manual-only until the complete application source and Azure resources are in place.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: wellbridge-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js standalone output
        run: |
          npm run build
          mkdir -p .next/standalone/public
          cp -a public/. .next/standalone/public/ 2>/dev/null || true
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
      - name: Azure login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy standalone app to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .next/standalone
