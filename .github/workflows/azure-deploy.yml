name: Build and deploy WellBridge AI to Azure App Service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: wellbridge-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build Next.js standalone output
        run: |
          npm run build
          mkdir -p .next/standalone/public
          cp -a public/. .next/standalone/public/ 2>/dev/null || true
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static

      - name: Azure login using GitHub OIDC
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Detect this GitHub runner's public IPv4
        id: runner-ip
        run: |
          set -euo pipefail
          ip="$(curl --fail --silent --show-error --ipv4 https://api.ipify.org)"
          if [[ ! "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid runner IPv4 address."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow this runner on the Azure SCM site
        id: scm-rule
        run: |
          az webapp config access-restriction add \
            --resource-group rg-wellbridge-nigeria-dev \
            --name wellbridge-ai-nigeria-dev \
            --rule-name "github-${GITHUB_RUN_ID}" \
            --action Allow \
            --ip-address "${{ steps.runner-ip.outputs.ip }}/32" \
            --priority 100 \
            --scm-site true

      - name: Deny all other SCM traffic
        run: |
          az webapp config access-restriction set \
            --resource-group rg-wellbridge-nigeria-dev \
            --name wellbridge-ai-nigeria-dev \
            --scm-default-action Deny

      - name: Deploy standalone app to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .next/standalone

      - name: Remove temporary SCM runner rule
        if: always() && steps.scm-rule.outcome == 'success'
        run: |
          az webapp config access-restriction remove \
            --resource-group rg-wellbridge-nigeria-dev \
            --name wellbridge-ai-nigeria-dev \
            --rule-name "github-${GITHUB_RUN_ID}" \
            --scm-site true
